[pytest]
# Scope test discovery to the automated test suite. Without this, a bare
# `pytest` run from the repo root also collects root-level manual smoke-test
# scripts (e.g. test_gemini.py, test_candidate_real.py, test_jd_real.py)
# that make real Gemini API calls at import time — which both violates this
# project's "never make real API calls in automated tests" rule and makes
# the suite fail non-deterministically on transient API errors. Those
# scripts remain runnable directly, e.g. `python test_gemini.py`.
testpaths = tests
